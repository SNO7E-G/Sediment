name: Golden corpus

# Checks Sediment's output against ten real, pinned plugins from wordpress.org.
# Hand-written fixtures prove the analyzer handles the shapes we thought of; this
# proves it handles the shapes other people actually wrote, and makes any change
# in what we say about a real plugin show up as a diff instead of silently.
#
# Kept separate from the unit suite: it downloads several plugins and scans
# thousands of files, so it takes minutes rather than seconds.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    name: Manifests match the recorded expectations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # Pinned versions, so the cache is valid until the corpus itself changes.
      - name: Cache the plugin corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/plugins
          key: golden-corpus-${{ hashFiles('tests/Golden/GoldenCorpus.php') }}

      - name: Check the corpus
        env:
          SEDIMENT_FETCH_GOLDEN: '1'
        run: php vendor/bin/phpunit --testsuite Golden
