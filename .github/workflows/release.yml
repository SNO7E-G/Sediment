name: Release

# Publishes a GitHub release straight from CHANGELOG.md.
#
# The top `## [X.Y.Z]` section of the changelog is the source of truth. When that
# section carries a date instead of "unreleased", pushing it to main tags the
# commit and publishes the release with those notes. Marking a section
# "unreleased" is how you accumulate work without shipping it, so the date is the
# release switch.

on:
  push:
    branches: [ main ]
    paths: [ 'CHANGELOG.md' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish from changelog
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read the top changelog section
        id: changelog
        run: |
          heading=$(grep -m1 '^## \[' CHANGELOG.md || true)
          if [ -z "$heading" ]; then
            echo "No release section found in CHANGELOG.md."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(printf '%s\n' "$heading" | sed -E 's/^## \[([^]]+)\].*/\1/')

          # A section still marked "unreleased" is work in progress, not a release.
          if printf '%s\n' "$heading" | grep -qi 'unreleased'; then
            echo "Top section ${version} is marked unreleased; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Already shipped? Then this push changed something else in the file.
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Release v${version} already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Body: everything under this heading, up to the next release or the
          # link definitions at the foot of the file. Literal prefix match avoids
          # escaping pitfalls with a dynamic regex.
          awk -v ver="$version" '
            BEGIN { header = "## [" ver "]" }
            index($0, header) == 1 { flag = 1; next }
            flag && /^## \[/ { exit }
            flag && /^\[.*\]: http/ { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Publishing v${version}."
        env:
          GH_TOKEN: ${{ github.token }}

      # Every release carries a runnable binary, so someone can use Sediment
      # without Composer or a PHP toolchain of their own.
      - name: Set up PHP
        if: steps.changelog.outputs.publish == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          ini-values: phar.readonly=0

      - name: Build the PHAR
        if: steps.changelog.outputs.publish == 'true'
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          php bin/build-phar.php
          php build/sediment.phar --version

      - name: Create the release
        if: steps.changelog.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.changelog.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.changelog.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: build/sediment.phar
          prerelease: ${{ contains(steps.changelog.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.changelog.outputs.version, '-') }}
