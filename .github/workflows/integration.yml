name: Live WordPress

# Runs a generated uninstall.php against a real WordPress database and asserts it
# removes exactly the plugin's own data and nothing else. Unit tests can show the
# generated file says the right thing; only this shows it does the right thing.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  uninstall-execution:
    name: Generated uninstall.php against WordPress
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: sediment_wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # A pinned release with its checksum recorded here, not fetched from the
      # same host at run time: the test runs whatever this archive contains.
      # To move to a newer WordPress, change both lines together.
      - name: Download WordPress
        env:
          WP_VERSION: '7.1.3'
          WP_SHA256: d2a09acb6a15e3b9c471d72557753c266d6f41a79ed19bfe04cbfe49e283b2a5
        run: |
          curl -sSfL "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" -o wordpress.tar.gz
          echo "${WP_SHA256}  wordpress.tar.gz" | sha256sum -c -
          tar -xzf wordpress.tar.gz
          echo "SEDIMENT_WP_PATH=$GITHUB_WORKSPACE/wordpress" >> "$GITHUB_ENV"

      - name: Configure and install WordPress
        run: |
          cat > wordpress/wp-config.php <<'PHP'
          <?php
          define('DB_NAME', 'sediment_wp');
          define('DB_USER', 'root');
          define('DB_PASSWORD', '');
          define('DB_HOST', '127.0.0.1');
          define('DB_CHARSET', 'utf8mb4');
          define('DB_COLLATE', '');
          define('AUTH_KEY','s1');define('SECURE_AUTH_KEY','s2');define('LOGGED_IN_KEY','s3');define('NONCE_KEY','s4');
          define('AUTH_SALT','s5');define('SECURE_AUTH_SALT','s6');define('LOGGED_IN_SALT','s7');define('NONCE_SALT','s8');
          $table_prefix = 'wp_';
          if (!defined('ABSPATH')) define('ABSPATH', __DIR__ . '/');
          require_once ABSPATH . 'wp-settings.php';
          PHP

          php -r '
            define("WP_INSTALLING", true);
            require getenv("SEDIMENT_WP_PATH") . "/wp-load.php";
            require ABSPATH . "wp-admin/includes/upgrade.php";
            if (!is_blog_installed()) {
              wp_install("Sediment CI", "admin", "admin@example.test", true, "", "password");
            }
            echo "WordPress " . get_bloginfo("version") . " installed\n";
          '

      - name: Run the live uninstall check
        run: php vendor/bin/phpunit --testsuite Integration
